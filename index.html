<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0807">
  <title>Juan &amp; Ruth · Nuestra boda</title>
  <meta name="description" content="Estás invitado a la boda de Juan y Ruth. 31 de diciembre de 2026.">
  <link rel="preload" href="fonts/greatvibes-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div id="loader" class="loader" role="status">Preparando el libro…</div>

  <div id="gate" class="gate" hidden>
    <button id="openBtn" class="open-btn">Abrir invitación</button>
  </div>

  <nav id="hud" class="hud" aria-label="Páginas" hidden>
    <div id="dots" class="dots" role="group" aria-label="Ir a una página"></div>
    <div class="hud__row">
      <button id="prevBtn" class="nav-btn" aria-label="Página anterior">‹</button>
      <div class="hud__mid"><span id="counter" class="counter">1 / 8</span><span id="pageTitle" class="page-title"></span></div>
      <button id="nextBtn" class="nav-btn" aria-label="Página siguiente">›</button>
    </div>
  </nav>
  <p id="hint" class="hint" hidden>Desliza para pasar la página</p>
  <button id="readBtn" class="read-btn" aria-pressed="false" hidden>Leer</button>
  <button id="muteBtn" class="mute" aria-label="Silenciar música" aria-pressed="false" hidden>♪</button>

  <div id="live" class="sr" aria-live="polite"></div>
  <noscript><p class="sr">Esta invitación necesita JavaScript.</p></noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
